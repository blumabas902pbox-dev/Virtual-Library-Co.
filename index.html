<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Library - Public Domain Sanctuary</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #020208;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f3f4f6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .aurora-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% -20%, #0d1b3e 0%, #020208 70%);
        }

        .aurora-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            mix-blend-mode: screen;
            animation: drift 25s infinite alternate ease-in-out;
        }

        .glow-1 {
            top: -10%;
            left: 20%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, #1e40af 0%, transparent 70%);
            animation-duration: 20s;
        }

        .glow-2 {
            top: -5%;
            right: 15%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            animation-duration: 28s;
            animation-delay: -5s;
        }

        .glow-3 {
            top: 20%;
            left: 35%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, #0f172a 0%, transparent 70%);
            animation-duration: 35s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(6%, 8%) scale(1.1) rotate(180deg); }
            100% { transform: translate(-4%, -5%) scale(0.9) rotate(360deg); }
        }

        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(38, 99, 231, 0.6);
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.85rem;
            color: #9ca3af;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .search-container {
            max-width: 90%;
            margin: 0 auto;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            text-align: center;
        }

        .search-bar:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .library-container {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            padding: 0 6px 1.5rem 6px;
            position: relative;
            z-index: 5;
        }

        .storage-cabinet {
            background: linear-gradient(to bottom, rgba(16, 12, 8, 0.96), rgba(8, 6, 4, 0.98));
            border-left: 10px solid #2e1c0c;
            border-right: 10px solid #2e1c0c;
            border-top: 18px solid #3d2612;
            border-bottom: 10px solid #2e1c0c;
            border-radius: 8px;
            box-shadow: 
                inset 0 0 40px rgba(0, 0, 0, 0.95),
                0 20px 40px rgba(0, 0, 0, 0.85);
            padding: 1.5rem 0 0 0;
            width: 100%;
        }

        .shelf-row {
            margin-bottom: 2.8rem;
            position: relative;
            width: 100%;
        }
        .shelf-row:last-child {
            margin-bottom: 0px !important;
        }

        .shelf-books {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0 2px;
            height: 110px;
            gap: 1px;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .shelf-base {
            width: 100%;
            height: 12px;
            background: repeating-linear-gradient(
                to bottom,
                #442e19 0px, #442e19 2px,
                #23160a 2px, #23160a 4px,
                #4e3620 4px, #4e3620 6px
            );
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom: 2px solid rgba(0, 0, 0, 0.9);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .shelf-base::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #20140a 0%, #301f10 25%, #1c1108 50%, #3a2513 75%, #20140a 100%);
            transform: perspective(100px) rotateX(20deg);
            transform-origin: bottom center;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.95);
            z-index: 1;
        }

        .book {
            position: relative;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 1; 
            min-width: 9px;
            width: calc(var(--raw-w) * 0.35);
            height: calc(var(--raw-h) * 0.48);
            box-shadow: 
                inset 2px 0 3px rgba(0, 0, 0, 0.6),
                inset -1px 0 2px rgba(0, 0, 0, 0.4),
                2px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .book::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(to right, 
                    rgba(0,0,0,0.5) 0%, 
                    rgba(0,0,0,0.1) 6%, 
                    rgba(255,255,255,0.08) 10%, 
                    transparent 18%, 
                    transparent 85%, 
                    rgba(0,0,0,0.45) 100%
                ),
                repeating-linear-gradient(to bottom, transparent 0px, transparent 20px, rgba(0, 0, 0, 0.3) 21px, rgba(234, 179, 8, 0.15) 22px, transparent 23px);
            border-radius: inherit;
            pointer-events: none;
            z-index: 2;
        }

        .book::after {
            content: '';
            position: absolute;
            left: 12%;
            width: 76%;
            height: 100%;
            top: 0;
            background: 
                linear-gradient(to bottom, transparent 6px, rgba(212, 175, 55, 0.4) 6px, rgba(212, 175, 55, 0.4) 7px, transparent 7px),
                linear-gradient(to top, transparent 6px, rgba(212, 175, 55, 0.4) 6px, rgba(212, 175, 55, 0.4) 7px, transparent 7px);
            pointer-events: none;
            z-index: 3;
        }

        .book.pose-upright {
            transform-origin: bottom center;
            border-radius: 2px 1px 1px 2px;
        }
        .book.pose-upright:hover {
            transform: translateY(-10px) scale(1.05);
            z-index: 10;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.5);
        }
        .book.pose-upright .book-title,
        .book.pose-tilted-left .book-title,
        .book.pose-tilted-right .book-title {
            writing-mode: vertical-rl;
            width: max-content;
            height: 85%;
            transform: translate(-50%, -50%) rotate(180deg) scale(0.52);
        }

        .book.pose-tilted-left {
            transform: rotate(-2deg);
            transform-origin: bottom right;
            border-radius: 2px 1px 1px 2px;
        }
        .book.pose-tilted-left:hover {
            transform: rotate(0deg) translateY(-10px) scale(1.05);
            z-index: 10;
        }

        .book.pose-tilted-right {
            transform: rotate(2deg);
            transform-origin: bottom left;
            border-radius: 1px 2px 2px 1px;
        }
        .book.pose-tilted-right:hover {
            transform: rotate(0deg) translateY(-10px) scale(1.05);
            z-index: 10;
        }

        .horizontal-stack {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            justify-content: flex-end;
            margin: 0 1px;
            position: relative;
            z-index: 2;
            flex-shrink: 1;
        }

        .book.pose-horizontal {
            border-radius: 1px 1px 2px 2px;
            margin-bottom: 1px;
            width: calc((var(--raw-h) - 30px) * 0.35);
            height: calc(var(--raw-w) * 0.48);
        }
        .book.pose-horizontal:hover {
            transform: translateX(6px) scale(1.03);
            z-index: 10;
        }
        .book.pose-horizontal .book-title {
            writing-mode: horizontal-tb;
            transform: translate(-50%, -50%) scale(0.58);
            width: 100%;
            height: auto;
            padding: 0 2px;
        }

        .book-title {
            position: absolute;
            top: 50%;
            left: 50%;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1px;
            color: rgba(245, 245, 240, 0.92);
            text-shadow: -1px -1px 0px rgba(0, 0, 0, 0.7);
            max-height: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            z-index: 4;
            pointer-events: none;
        }

        .book-tooltip {
            position: absolute;
            bottom: 112%;
            left: 50%;
            transform: translateX(-50%) translateY(-4px);
            background: rgba(11, 14, 24, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 10px 14px;
            border-radius: 6px;
            width: 180px;
            text-align: center;
            box-shadow: 0 10px 24px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 100;
            writing-mode: horizontal-tb !important;
            transform-origin: bottom center;
        }

        .book-tooltip h3 {
            font-size: 0.85rem;
            color: #fff;
            margin-bottom: 2px;
            white-space: normal;
        }

        .book-tooltip p {
            font-size: 0.72rem;
            color: #9ca3af;
            white-space: normal;
        }

        .book:hover .book-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(-8px);
        }

        @media (min-width: 768px) {
            header {
                padding: 3rem 2rem 1.5rem;
            }
            header h1 {
                font-size: 3rem;
            }
            header p {
                font-size: 1rem;
            }
            .search-container {
                max-width: 500px;
            }
            .library-container {
                padding: 0 0 1.5rem 0;
            }
            .storage-cabinet {
                border-left: 24px solid #2e1c0c;
                border-right: 24px solid #2e1c0c;
                border-top: 32px solid #3d2612;
                border-bottom: 24px solid #2e1c0c;
                padding: 4rem 0 0 0;
            }
            .shelf-row {
                margin-bottom: 5.5rem;
            }
            .shelf-row:last-child {
                margin-bottom: 0px !important;
            }
            .shelf-books {
                height: 250px;
                gap: 16px;
                padding: 0 30px;
            }
            .shelf-base {
                height: 22px;
                background: repeating-linear-gradient(
                    to bottom,
                    #442e19 0px, #442e19 3px,
                    #23160a 3px, #23160a 5px,
                    #4e3620 5px, #4e3620 8px,
                    #1b1006 8px, #1b1006 10px
                );
            }
            .shelf-base::before {
                content: '';
                top: -10px;
                height: 10px;
            }
            .book {
                width: var(--raw-w);
                height: var(--raw-h);
                min-width: auto;
            }
            .book::before {
                background: 
                    linear-gradient(to right, 
                        rgba(0,0,0,0.5) 0%, 
                        rgba(0,0,0,0.1) 6%, 
                        rgba(255,255,255,0.08) 10%, 
                        transparent 18%, 
                        transparent 85%, 
                        rgba(0,0,0,0.45) 100%
                    ),
                    repeating-linear-gradient(to bottom, transparent 0px, transparent 36px, rgba(0, 0, 0, 0.35) 37px, rgba(234, 179, 8, 0.2) 38px, transparent 39px);
            }
            .book::after {
                background: 
                    linear-gradient(to bottom, transparent 10px, rgba(212, 175, 55, 0.45) 10px, rgba(212, 175, 55, 0.45) 12px, transparent 12px),
                    linear-gradient(to top, transparent 10px, rgba(212, 175, 55, 0.45) 10px, rgba(212, 175, 55, 0.45) 12px, transparent 12px);
            }
            .book.pose-upright:hover,
            .book.pose-tilted-left:hover,
            .book.pose-tilted-right:hover {
                transform: translateY(-16px) scale(1.04);
            }
            .book.pose-upright .book-title,
            .book.pose-tilted-left .book-title,
            .book.pose-tilted-right .book-title {
                transform: translate(-50%, -50%) rotate(180deg) scale(1);
                width: max-content;
                height: 85%;
            }
            .book.pose-tilted-left {
                transform: rotate(-5deg);
                margin-right: 20px;
            }
            .book.pose-tilted-right {
                transform: rotate(5deg);
                margin-left: 20px;
            }
            .horizontal-stack {
                margin: 0 12px;
            }
            .book.pose-horizontal {
                width: calc(var(--raw-h) - 30px);
                height: var(--raw-w);
                margin-bottom: 3px;
            }
            .book.pose-horizontal:hover {
                transform: translateX(10px) scale(1.02);
            }
            .book.pose-horizontal .book-title {
                transform: translate(-50%, -50%) scale(1);
                padding: 4px;
                width: 100%;
                height: auto;
            }
            .book-title {
                font-size: 0.72rem;
            }
            .book-tooltip {
                width: 210px;
            }
        }

        footer {
            text-align: center;
            color: #4b5563;
            font-size: 0.85rem;
            padding: 1rem 2rem 2rem;
            width: 100%;
        }
    </style>
    
</head>

            { title: "Nicholas Nickleby", author: "Charles Dickens", url: "https://www.gutenberg.org/ebooks/967" },

            { title: "A Christmas Carol", author: "Charles Dickens", url: "https://www.gutenberg.org/ebooks/46" }
        ];

        const spinePalettes = [
            "linear-gradient(to right, #7a1f1d, #420f0e)", 
            "linear-gradient(to right, #1b365d, #0d1b30)", 
            "linear-gradient(to right, #1e4620, #0f2410)", 
            "linear-gradient(to right, #4a3b32, #261e19)", 
            "linear-gradient(to right, #5c3a21, #301e11)", 
            "linear-gradient(to right, #1c1c1c, #0a0a0a)"  
        ];

        const libraryShelves = document.getElementById('libraryShelves');
        const searchBar = document.getElementById('searchBar');

        function createBookElement(book, globalIndex, poseOverride = null) {
            const bookDiv = document.createElement('div');
            const palette = spinePalettes[globalIndex % spinePalettes.length];
            
            let pose = poseOverride;
            if (!pose) {
                const roll = Math.random();
                if (roll < 0.70) pose = "upright";
                else if (roll < 0.85) pose = "tilted-left";
                else pose = "tilted-right";
            }

            bookDiv.className = `book pose-${pose}`;
            bookDiv.style.background = palette;
            bookDiv.setAttribute('onclick', `window.open('${book.url}', '_blank')`);

            let spineWidth = Math.floor(Math.random() * (42 - 34 + 1)) + 34;
            let spineHeight = Math.floor(Math.random() * (215 - 190 + 1)) + 190;

            bookDiv.style.setProperty('--raw-w', `${spineWidth}px`);
            bookDiv.style.setProperty('--raw-h', `${spineHeight}px`);

            bookDiv.innerHTML = `
                <div class="book-title">${book.title}</div>
                <div class="book-tooltip">
                    <h3>${book.title}</h3>
                    <p>by ${book.author}</p>
                    <span style="font-size: 11px; color:#3b82f6; display:inline-block; margin-top:8px;">Click to Open Free eCopy &rarr;</span>
                </div>
            `;
            return bookDiv;
        }

        function renderLibrary(filteredBooks) {
            libraryShelves.innerHTML = '';
            if(filteredBooks.length === 0) {
                libraryShelves.innerHTML = `<div style="text-align:center; padding: 3rem 1rem; color: #6b7280;">No matching entries found inside the cabinet.</div>`;
                return;
            }

            const maxShelves = 6;
            const shelvesData = Array.from({ length: maxShelves }, () => []);

            filteredBooks.forEach((book, index) => {
                const targetShelf = index % maxShelves;
                shelvesData[targetShelf].push({ book, globalIndex: index });
            });

            shelvesData.forEach(shelfBooksData => {
                if (shelfBooksData.length === 0) return;

                const shelfRow = document.createElement('div');
                shelfRow.className = 'shelf-row';
                const shelfBooksContainer = document.createElement('div');
                shelfBooksContainer.className = 'shelf-books';

                for (let i = 0; i < shelfBooksData.length; i++) {
                    const currentItem = shelfBooksData[i];

                    if (Math.random() < 0.12 && i < shelfBooksData.length - 1) {
                        const stackWrapper = document.createElement('div');
                        stackWrapper.className = 'horizontal-stack';
                        
                        stackWrapper.appendChild(createBookElement(currentItem.book, currentItem.globalIndex, "horizontal"));
                        i++;
                        const nextItem = shelfBooksData[i];
                        stackWrapper.appendChild(createBookElement(nextItem.book, nextItem.globalIndex, "horizontal"));
                        
                        shelfBooksContainer.appendChild(stackWrapper);
                    } else {
                        shelfBooksContainer.appendChild(createBookElement(currentItem.book, currentItem.globalIndex));
                    }
                }

                const shelfBase = document.createElement('div');
                shelfBase.className = 'shelf-base';
                
                shelfRow.appendChild(shelfBooksContainer);
                shelfRow.appendChild(shelfBase);
                libraryShelves.appendChild(shelfRow);
            });
        }

        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = catalog.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.author.toLowerCase().includes(query)
            );
            renderLibrary(filtered);
        });
        renderLibrary(catalog);
    </script>
